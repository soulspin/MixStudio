[package]
name = "mixstudio"
version = "0.1.0-alpha"
authors = ["soulspin"]
license = "MIT"
description = "A DAW-style DJ mixing app where every song is its own clip on a timeline"
repository = "https://github.com/soulspin/MixStudio"
edition = "2021"
rust-version = "1.85"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
rustfft = "6"
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "mp3", "flac", "ogg", "vorbis", "isomp4", "aac", "alac"] }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
cpal = "0.15"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
opt-level = 2
